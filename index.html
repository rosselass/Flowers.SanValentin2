<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz San Valentín</title>
    <style>
*,
*::after,
*::before {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

html {
  overflow: hidden;
  width: 100%;
  height: 100%;
  position: fixed;
  -webkit-overflow-scrolling: touch;
}

:root {
  --dark-color: #000;
  --fl-speed: 0.8s;
  --speed-leaf: 2s;
  --vh: 1vh;
}

body {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 100vh;
  min-height: calc(var(--vh, 1vh) * 100);
  height: 100%;
  width: 100%;
  background-color: var(--dark-color);
  overflow: hidden;
  perspective: 1000px;
  margin: 0;
  padding: 0;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  -webkit-text-size-adjust: 100%;
}

.valentine-message {
  position: fixed;
  top: 15%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  text-align: center;
  font-family: 'Georgia', serif;
  animation: float-message 3s ease-in-out infinite;
}

.valentine-message h1 {
  font-size: 8vmin;
  font-weight: bold;
  background: linear-gradient(45deg, #ff1744, #ff6b9d, #ffb3d9, #ff1744);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(255, 23, 68, 0.8),
               0 0 60px rgba(255, 107, 157, 0.6),
               0 0 90px rgba(255, 23, 68, 0.4);
  animation: gradient-shift 3s ease infinite, glow-pulse 2s ease-in-out infinite;
  letter-spacing: 0.3vmin;
  filter: drop-shadow(0 0 1vmin rgba(255, 23, 68, 0.9));
}

@keyframes float-message {
  0%, 100% {
    transform: translateX(-50%) translateY(0);
  }
  50% {
    transform: translateX(-50%) translateY(-10px);
  }
}

@keyframes gradient-shift {
  0%, 100% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
}

@keyframes glow-pulse {
  0%, 100% {
    filter: drop-shadow(0 0 1vmin rgba(255, 23, 68, 0.9)) 
            drop-shadow(0 0 3vmin rgba(255, 107, 157, 0.6));
  }
  50% {
    filter: drop-shadow(0 0 2vmin rgba(255, 23, 68, 1)) 
            drop-shadow(0 0 5vmin rgba(255, 107, 157, 0.8));
  }
}

.music-controls {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.music-button {
  background: linear-gradient(135deg, #ff1744, #ff6b9d);
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  width: 60px;
  height: 60px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: white;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(255, 23, 68, 0.5);
}

.music-button:hover {
  transform: scale(1.1);
  box-shadow: 0 6px 20px rgba(255, 23, 68, 0.8);
}

.music-button:active {
  transform: scale(0.95);
}

.volume-control {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 0, 0, 0.7);
  padding: 10px 15px;
  border-radius: 25px;
  border: 2px solid rgba(255, 23, 68, 0.5);
}

.volume-slider {
  width: 100px;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: linear-gradient(to right, #ff1744, #ff6b9d);
  outline: none;
  border-radius: 5px;
  cursor: pointer;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  background: white;
  border: 2px solid #ff1744;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 5px rgba(255, 23, 68, 0.8);
}

.volume-slider::-moz-range-thumb {
  width: 16px;
  height: 16px;
  background: white;
  border: 2px solid #ff1744;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 5px rgba(255, 23, 68, 0.8);
}

.love-message {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: linear-gradient(135deg, rgba(255, 23, 68, 0.95), rgba(139, 0, 0, 0.95));
  padding: 30px 40px;
  border-radius: 20px;
  border: 3px solid rgba(255, 107, 157, 0.8);
  box-shadow: 0 0 40px rgba(255, 23, 68, 0.8),
              inset 0 0 20px rgba(255, 107, 157, 0.3);
  z-index: 150;
  max-width: 500px;
  text-align: center;
  pointer-events: none;
}

.love-message.show {
  animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
  pointer-events: auto;
}

.love-message.hide {
  animation: popOut 0.3s ease-in forwards;
}

.love-message p {
  font-family: 'Georgia', serif;
  font-size: 24px;
  color: white;
  margin: 0;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
  line-height: 1.6;
  font-style: italic;
}

.love-message .close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  background: none;
  border: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: all 0.3s ease;
  pointer-events: auto;
}

.love-message .close-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: rotate(90deg);
}

@keyframes popIn {
  0% {
    transform: translate(-50%, -50%) scale(0) rotate(-180deg);
    opacity: 0;
  }
  100% {
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    opacity: 1;
  }
}

@keyframes popOut {
  0% {
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -50%) scale(0) rotate(180deg);
    opacity: 0;
  }
}

.touch-flower-btn {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #ff1744, #ff6b9d);
  color: white;
  border: 3px solid rgba(255, 255, 255, 0.4);
  padding: 15px 30px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(255, 23, 68, 0.6),
              inset 0 -3px 10px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
  z-index: 100;
  font-family: 'Georgia', serif;
  animation: pulse-btn 2s ease-in-out infinite;
}

.touch-flower-btn:hover {
  transform: translateX(-50%) scale(1.05);
  box-shadow: 0 10px 35px rgba(255, 23, 68, 0.8),
              inset 0 -3px 10px rgba(0, 0, 0, 0.4);
}

.touch-flower-btn:active {
  transform: translateX(-50%) scale(0.98);
}

@keyframes pulse-btn {
  0%, 100% {
    box-shadow: 0 8px 25px rgba(255, 23, 68, 0.6),
                inset 0 -3px 10px rgba(0, 0, 0, 0.3);
  }
  50% {
    box-shadow: 0 8px 35px rgba(255, 23, 68, 0.9),
                inset 0 -3px 10px rgba(0, 0, 0, 0.3);
  }
}

.shooting-stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.shooting-star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8),
              0 0 20px 4px rgba(255, 255, 255, 0.5);
  animation: shoot linear forwards;
  left: 100%;
  opacity: 0;
}

.shooting-star::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 100px;
  height: 1px;
  background: linear-gradient(to right, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.8));
}

@keyframes shoot {
  0% {
    opacity: 1;
    transform: translateX(0) translateY(0);
  }
  70% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateX(-800px) translateY(400px);
  }
}

.night-content {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
}

.stars-container {
  position: absolute;
  width: 100%;
  height: 70%;
  top: 0;
  left: 0;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
  animation: twinkle var(--twinkle-duration, 3s) ease-in-out infinite;
  animation-delay: var(--twinkle-delay, 0s);
}

@keyframes twinkle {
  0%, 100% {
    opacity: 0.3;
    transform: scale(1);
  }
  50% {
    opacity: 1;
    transform: scale(1.2);
  }
}

body.not-loaded {
  overflow: hidden;
}

.long {
  filter: blur(1px);
  border-radius: 50%;
  animation: glow var(--fl-speed) ease-in-out infinite;
}

.flowers {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
}

.flower {
  position: relative;
  pointer-events: auto;
  cursor: pointer;
  transition: transform 0.3s ease;
  touch-action: manipulation;
}

.flower:hover {
  transform: scale(1.05);
}

.flower__head {
  animation: open-flower var(--fl-speed) ease-in-out;
  transform-origin: bottom center;
}

@keyframes open-flower {
  0% {
    transform: rotate(0deg);
  }
  50% {
    transform: rotate(-10deg);
  }
  100% {
    transform: rotate(0deg);
  }
}

.flower__line {
  width: 2px;
  height: 0;
  background-image: linear-gradient(to top, rgba(0, 128, 0, 0), #5c7c37);
  animation: grow-flower-tree calc(var(--fl-speed) * 4) ease-in-out;
  transform-origin: bottom center;
  position: relative;
}

@keyframes grow-flower-tree {
  0% {
    height: 0;
  }
  100% {
    height: var(--stem-height, 160px);
  }
}

.flower__line__leaf {
  --w: 7vmin;
  --h: calc(var(--w) + 2vmin);
  position: absolute;
  top: 20%;
  left: 50%;
  width: var(--w);
  height: var(--h);
  border-radius: 51% 49% 47% 53% / 44% 45% 55% 69%;
  background-image: linear-gradient(to top, rgba(20, 117, 122, 0.4), #5c7c37);
  animation: grow-flower-leafs var(--fl-speed) ease-in-out;
  transform-origin: bottom center;
}

.flower__line__leaf--1 {
  transform: rotate(-70deg) rotateY(50deg);
}

.flower__line__leaf--2 {
  top: 45%;
  animation-delay: 0.3s;
  transform: rotate(70deg) rotateY(50deg);
}

.flower__line__leaf--3 {
  top: 65%;
  animation-delay: 0.6s;
  transform: rotate(-70deg) rotateY(50deg);
}

.flower__line__leaf--4 {
  top: 85%;
  animation-delay: 0.9s;
  transform: rotate(70deg) rotateY(50deg);
}

@keyframes grow-flower-leafs {
  0% {
    transform-origin: bottom center;
    transform: rotate(0deg) rotateY(0deg) scale(0);
  }
}

.flower__head {
  position: relative;
  animation: blooming-flower var(--fl-speed) ease-in-out;
}

@keyframes blooming-flower {
  0%, 100% {
    transform: scale(0);
  }
}

.flower__light {
  position: absolute;
  width: 1px;
  height: 1px;
  background-color: rgb(255, 251, 0);
  box-shadow: 0 0 15px 10px rgba(255, 251, 0, 0.5);
  border-radius: 50%;
  opacity: 0;
  animation: light-flower 3s linear infinite;
}

@keyframes light-flower {
  0% {
    opacity: 1;
    box-shadow: 0 0 15px 10px rgba(255, 251, 0, 0.5);
  }
  100% {
    opacity: 0.1;
    box-shadow: 0 0 8px 5px rgba(255, 251, 0, 0.2);
  }
}

.flower__head__leaf {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform-origin: bottom center;
  background-image: radial-gradient(circle at bottom, #ff4d6d, #e63946, #d62828);
  animation: blooming-leaf-right var(--fl-speed) ease-in-out;
  filter: drop-shadow(0 0 8px rgba(255, 77, 109, 0.7));
}

@keyframes blooming-leaf-right {
  0% {
    transform-origin: bottom left;
    transform: rotate(70deg) rotateY(30deg) scale(0);
  }
}

.flower__head__leaf--1 {
  width: 8vmin;
  height: 10vmin;
  border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
  left: -30%;
  transform: rotate(70deg) rotateY(30deg);
}

.flower__head__leaf--2 {
  width: 8vmin;
  height: 10vmin;
  border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
  left: 50%;
  transform: rotate(-70deg) rotateY(-30deg);
  animation: blooming-leaf-left var(--fl-speed) ease-in-out;
}

@keyframes blooming-leaf-left {
  0% {
    transform-origin: bottom right;
    transform: rotate(-70deg) rotateY(-30deg) scale(0);
  }
}

.flower__head__leaf--3 {
  width: 8vmin;
  height: 10vmin;
  border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
  left: -10%;
  transform: rotate(20deg) rotateY(20deg);
}

.flower__head__leaf--4 {
  width: 8vmin;
  height: 10vmin;
  border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
  left: 0%;
  transform: rotate(-20deg) rotateY(-20deg);
  animation: blooming-leaf-left var(--fl-speed) ease-in-out;
}

.flower__head__leaf--5 {
  width: 10vmin;
  height: 12vmin;
  border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
  left: -25%;
  top: -15%;
  transform: rotate(60deg) rotateY(25deg);
  background-image: radial-gradient(circle at bottom, #ff6b9d, #ff1744, #c41e3a);
  filter: drop-shadow(0 0 10px rgba(255, 107, 157, 0.8));
}

.flower__head__leaf--6 {
  width: 10vmin;
  height: 12vmin;
  border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
  left: 45%;
  top: -15%;
  transform: rotate(-60deg) rotateY(-25deg);
  animation: blooming-leaf-left var(--fl-speed) ease-in-out;
  background-image: radial-gradient(circle at bottom, #ff6b9d, #ff1744, #c41e3a);
  filter: drop-shadow(0 0 10px rgba(255, 107, 157, 0.8));
}

@keyframes glow {
  0%, 100% {
    filter: drop-shadow(0 0 8px rgba(255, 77, 109, 0.5));
  }
  50% {
    filter: drop-shadow(0 0 15px rgba(255, 77, 109, 0.9));
  }
}

.flower__head__center {
  position: absolute;
  width: 3.5vmin;
  height: 3.5vmin;
  border-radius: 50%;
  background: radial-gradient(circle, #8b0000, #4a0000);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5),
              0 0 10px rgba(139, 0, 0, 0.5);
  animation: center-glow 2s ease-in-out infinite;
}

@keyframes center-glow {
  0%, 100% {
    box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5),
                0 0 10px rgba(139, 0, 0, 0.5);
  }
  50% {
    box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.7),
                0 0 15px rgba(139, 0, 0, 0.8);
  }
}

.flower--1 {
  --stem-height: 160px;
  animation: moving-flower-1 4s linear infinite;
}

.flower--1 .flower__line {
  height: var(--stem-height);
  animation-delay: 0.3s;
}

.flower--1 .flower__head__leaf--1 {
  animation-delay: 0.6s;
}

.flower--1 .flower__head__leaf--2 {
  animation-delay: 0.7s;
}

.flower--1 .flower__head__leaf--3 {
  animation-delay: 0.8s;
}

.flower--1 .flower__head__leaf--4 {
  animation-delay: 0.9s;
}

.flower--1 .flower__head__leaf--5 {
  animation-delay: 1s;
}

.flower--1 .flower__head__leaf--6 {
  animation-delay: 1.1s;
}

@keyframes moving-flower-1 {
  0%, 100% {
    transform: rotate(2deg);
  }
  50% {
    transform: rotate(-2deg);
  }
}

.flower--2 {
  left: 50%;
  transform: rotateY(-180deg);
  --stem-height: 180px;
  animation: moving-flower-2 4s linear infinite;
}

.flower--2 .flower__line {
  height: var(--stem-height);
  animation-delay: 0.6s;
}

.flower--2 .flower__head__leaf--1 {
  animation-delay: 0.9s;
}

.flower--2 .flower__head__leaf--2 {
  animation-delay: 1s;
}

.flower--2 .flower__head__leaf--3 {
  animation-delay: 1.1s;
}

.flower--2 .flower__head__leaf--4 {
  animation-delay: 1.2s;
}

.flower--2 .flower__head__leaf--5 {
  animation-delay: 1.3s;
}

.flower--2 .flower__head__leaf--6 {
  animation-delay: 1.4s;
}

@keyframes moving-flower-2 {
  0%, 100% {
    transform: rotateY(-180deg) rotate(2deg);
  }
  50% {
    transform: rotateY(-180deg) rotate(-2deg);
  }
}

.flower--3 {
  left: 50%;
  --stem-height: 140px;
  animation: moving-flower-3 4s linear infinite;
}

.flower--3 .flower__line {
  height: var(--stem-height);
  animation-delay: 0.9s;
}

.flower--3 .flower__head__leaf--1 {
  animation-delay: 1.2s;
}

.flower--3 .flower__head__leaf--2 {
  animation-delay: 1.3s;
}

.flower--3 .flower__head__leaf--3 {
  animation-delay: 1.4s;
}

.flower--3 .flower__head__leaf--4 {
  animation-delay: 1.5s;
}

.flower--3 .flower__head__leaf--5 {
  animation-delay: 1.6s;
}

.flower--3 .flower__head__leaf--6 {
  animation-delay: 1.7s;
}

@keyframes moving-flower-3 {
  0%, 100% {
    transform: rotate(2deg);
  }
  50% {
    transform: rotate(-2deg);
  }
}

.flower--4 {
  left: 48%;
  transform: rotateY(-180deg);
  --stem-height: 155px;
  animation: moving-flower-4 4s linear infinite;
}

.flower--4 .flower__line {
  height: var(--stem-height);
  animation-delay: 1.2s;
}

.flower--4 .flower__head__leaf--1 {
  animation-delay: 1.5s;
}

.flower--4 .flower__head__leaf--2 {
  animation-delay: 1.6s;
}

.flower--4 .flower__head__leaf--3 {
  animation-delay: 1.7s;
}

.flower--4 .flower__head__leaf--4 {
  animation-delay: 1.8s;
}

.flower--4 .flower__head__leaf--5 {
  animation-delay: 1.9s;
}

.flower--4 .flower__head__leaf--6 {
  animation-delay: 2s;
}

@keyframes moving-flower-4 {
  0%, 100% {
    transform: rotateY(-180deg) rotate(2deg);
  }
  50% {
    transform: rotateY(-180deg) rotate(-2deg);
  }
}

.flower--5 {
  left: 52%;
  --stem-height: 170px;
  animation: moving-flower-5 4s linear infinite;
}

.flower--5 .flower__line {
  height: var(--stem-height);
  animation-delay: 1.5s;
}

.flower--5 .flower__head__leaf--1 {
  animation-delay: 1.8s;
}

.flower--5 .flower__head__leaf--2 {
  animation-delay: 1.9s;
}

.flower--5 .flower__head__leaf--3 {
  animation-delay: 2s;
}

.flower--5 .flower__head__leaf--4 {
  animation-delay: 2.1s;
}

.flower--5 .flower__head__leaf--5 {
  animation-delay: 2.2s;
}

.flower--5 .flower__head__leaf--6 {
  animation-delay: 2.3s;
}

@keyframes moving-flower-5 {
  0%, 100% {
    transform: rotate(2deg);
  }
  50% {
    transform: rotate(-2deg);
  }
}

.growing-grass {
  position: absolute;
  bottom: -10px;
  left: 0;
  width: 100%;
  height: 100px;
  transform-origin: bottom center;
}

.flower__grass {
  position: absolute;
  bottom: 0;
  left: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  width: 100%;
  height: 100%;
  transform-origin: bottom center;
}

.flower__grass--1 {
  animation: moving-grass 3s linear infinite;
}

@keyframes moving-grass {
  0%, 100% {
    transform: rotate(-2deg);
  }
  50% {
    transform: rotate(2deg);
  }
}

.flower__grass--2 {
  animation: moving-grass--2 4s linear infinite;
}

@keyframes moving-grass--2 {
  0%, 100% {
    transform: scale(0.5) rotate(3deg);
  }
  50% {
    transform: scale(0.5) rotate(-3deg);
  }
}

.flower__grass--3 {
  animation: moving-grass--3 3.5s linear infinite;
  left: 5%;
}

@keyframes moving-grass--3 {
  0%, 100% {
    transform: scale(0.6) rotate(-2deg);
  }
  50% {
    transform: scale(0.6) rotate(2deg);
  }
}

.flower__grass--4 {
  animation: moving-grass--4 4.5s linear infinite;
  left: 15%;
}

@keyframes moving-grass--4 {
  0%, 100% {
    transform: scale(0.4) rotate(2deg);
  }
  50% {
    transform: scale(0.4) rotate(-2deg);
  }
}

.flower__grass--5 {
  animation: moving-grass--5 3.8s linear infinite;
  left: 25%;
}

@keyframes moving-grass--5 {
  0%, 100% {
    transform: scale(0.55) rotate(-3deg);
  }

  <script>
    // Fix para viewport height en móviles
    function setVHProperty() {
      let vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }

    setVHProperty();
    window.addEventListener('resize', setVHProperty);
    window.addEventListener('orientationchange', setVHProperty);

    // Generar estrellas
    function createStars() {
      const container = document.getElementById('starsContainer');
      const starCount = 100;

      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.setProperty('--twinkle-duration', (Math.random() * 3 + 2) + 's');
        star.style.setProperty('--twinkle-delay', Math.random() * 3 + 's');
        container.appendChild(star);
      }
    }

    createStars();

    function toggleMusic() {
      const audio = document.getElementById('backgroundMusic');
      const btn = document.getElementById('playPauseBtn');
      
      if (audio.paused) {
        audio.play();
        btn.textContent = '⏸️';
      } else {
        audio.pause();
        btn.textContent = '▶️';
      }
    }

    function changeVolume() {
      const audio = document.getElementById('backgroundMusic');
      const slider = document.getElementById('volumeSlider');
      audio.volume = slider.value / 100;
    }

    const loveMessages = [
      "Eres la razón por la que creo en el amor verdadero ❤️",
      "Cada momento contigo es un regalo precioso 🌹",
      "Mi corazón late más fuerte cuando estás cerca 💕",
      "Eres mi persona favorita en todo el universo 💕",
      "Contigo, cada día es San Valentín 💕",
      "Tu sonrisa ilumina hasta mis días más oscuros 💕",
      "Gracias por ser mi compañer@ de aventuras ❤️",
      "El amor que siento por ti crece cada día más 💕",
      "Eres mi hogar, mi refugio, mi todo ❤️ ",
      "No hay palabras suficientes para expresar cuánto te amo ❤️",
      "Contigo descubrí el verdadero significado del amor ❤️",
      "Eres el mejor regalo que la vida me ha dado ❤️",
      "Mi amor por ti es infinito como las estrellas 🌠",
      "Juntos somos invencibles ❤️",
      "Cada latido de mi corazón dice tu nombre 💓"
    ];

    let currentMessageIndex = -1;
    let musicStarted = false;
    let messageTimeout = null;

    onload = () => {
      const c = setTimeout(() => {
        document.body.classList.remove("not-loaded");
        
        // Estrellas fugaces
        function createShootingStar() {
          const star = document.createElement('div');
          star.className = 'shooting-star';
          star.style.top = Math.random() * 60 + '%';
          star.style.animationDelay = '0s';
          star.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
          document.querySelector('.shooting-stars').appendChild(star);
          setTimeout(() => { star.remove(); }, 4000);
        }
        
        setInterval(() => {
          if (Math.random() > 0.3) createShootingStar();
        }, Math.random() * 5000 + 3000);

        // CONFIGURACIÓN DE AUDIO
        const audio = document.getElementById('backgroundMusic');
        audio.src = 'cancion.mp3';
        audio.volume = 0.5;

        // Agregar evento a CADA flor
        const flowers = document.querySelectorAll('.flower');
        flowers.forEach((flower) => {
          flower.addEventListener('click', () => {
            showLoveMessage();

            if (!musicStarted) {
              audio.play().then(() => {
                musicStarted = true;
              }).catch(e => console.log("Error de audio:", e));
            }
          });
        });

        clearTimeout(c);
      }, 1000);
    };

    function showLoveMessage() {
      const messageDiv = document.getElementById('loveMessage');
      const messageText = document.getElementById('messageText');
      
      if (messageTimeout) {
        clearTimeout(messageTimeout);
        messageTimeout = null;
      }
      
      messageDiv.classList.remove('hide', 'show');
      
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * loveMessages.length);
      } while (newIndex === currentMessageIndex && loveMessages.length > 1);
      
      currentMessageIndex = newIndex;
      messageText.textContent = loveMessages[currentMessageIndex];
      
      setTimeout(() => {
        messageDiv.classList.add('show');
      }, 10);
      
      messageTimeout = setTimeout(() => closeMessage(), 10000);
    }

    function closeMessage() {
      const messageDiv = document.getElementById('loveMessage');
      
      if (messageTimeout) {
        clearTimeout(messageTimeout);
        messageTimeout = null;
      }
      
      messageDiv.classList.remove('show');
      messageDiv.classList.add('hide');
      setTimeout(() => messageDiv.classList.remove('hide'), 900);
    }

    function touchRandomFlower() {
      const flowers = document.querySelectorAll('.flower');
      const randomFlower = flowers[Math.floor(Math.random() * flowers.length)];
      randomFlower.click();
    }
